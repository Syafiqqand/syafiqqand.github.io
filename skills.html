<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />

    />

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet" />
    <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet" />
  </head>
  <body class="skills-page">
    <!-- Header -->
    <header id="header" class="header d-flex align-items-center light-background sticky-top">
      <div class="container position-relative d-flex align-items-center justify-content-between">
        <nav id="navmenu" class="navmenu">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="skills.html" class="active">Skills</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
          <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main class="main">
      <section class="section">
        <div class="container section-title" data-aos="fade-up">
          <h2>Skills</h2>
          <p>A summary of my technical skills and tools I use.</p>
        </div>

        <div class="container skills">
          <div class="row gy-4 justify-content-center">
            <!-- Programming Languages -->
            <div class="col-lg-5 col-md-6" data-aos="fade-up" data-aos-delay="100">
              <div class="skill-box big h-100">
                <h3>
                  <i class="bi bi-code-slash me-2"></i>
                  Programming Languages
                </h3>
                <ul class="skill-list">
                  <li>
                    <i class="devicon-c-plain colored"></i>
                    C
                  </li>
                  <li>
                    <i class="devicon-cplusplus-plain colored"></i>
                    C++
                  </li>
                  <li>
                    <i class="devicon-csharp-plain colored"></i>
                    C#
                  </li>
                  <li>
                    <img src="assets/img/icon/sql.png" alt="SQL" class="skill-icon" />
                    SQL
                  </li>
                </ul>
              </div>
            </div>

            <!-- Game Engine & Framework -->
            <div class="col-lg-5 col-md-6" data-aos="fade-up" data-aos-delay="200">
              <div class="skill-box big h-100">
                <h3>
                  <i class="bi bi-tools me-2"></i>
                  Engine & Framework
                </h3>
                <ul class="skill-list">
                  <li>
                    <img
                      src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/unity/unity-original.svg"
                      alt="Unity"
                      class="skill-icon"
                    />
                    Unity Engine
                  </li>
                  <li>
                    <i class="devicon-notion-plain colored"></i>
                    Notion
                  </li>
                  <li>
                    <img
                      src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/miro.svg"
                      alt="Miro"
                      class="skill-icon"
                    />
                    Miro
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer id="footer" class="footer">
      <div class="container text-center">
        <div class="credits">
          Designed by
          <a href="https://bootstrapmade.com/">BootstrapMade</a>
        </div>
      </div>
    </footer>

    <!-- Scroll Top -->
    <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
      <i class="bi bi-arrow-up-short"></i>
    </a>

    <div id="preloader"></div>

    <!-- Vendor JS -->
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/aos/aos.js"></script>
    <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
    <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Inline CSS untuk styling tambahan -->
    <style>
      .skills .skill-box {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        height: 100%;
        transition: transform 0.3s ease;
      }
      .skills .skill-box:hover {
        transform: translateY(-5px);
      }
      .skills .skill-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .skills .skill-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 1.05rem;
        color: color-mix(in srgb, var(--default-color), transparent 10%);
      }
      .skills .skill-list i.bi-dot {
        color: var(--accent-color);
        font-size: 1.2rem;
      }
      /* Bikin kotak agak besar */
      .skills .skill-box.big {
        min-height: 320px;
      }
      @media (min-width: 992px) {
        .skills .col-lg-5 {
          flex: 0 0 45%;
          max-width: 45%;
        }
      }
      .skill-icon {
        width: 28px;
        height: 28px;
        object-fit: contain;
        margin-right: 8px;
        vertical-align: middle;
        filter: brightness(0) invert(1); /* bikin logo terlihat putih di tema gelap */
      }
    </style>
  </body>
</html>
